<header class="site-header">
  <div class="container site-header__inner">

    <a
      href="{{ "/" | relURL }}"
      class="brand"
      aria-label="{{ .Site.Title }}"
    >
      {{ .Site.Params.headerRight }}
    </a>

    {{ with .Site.Menus.main }}
      <nav class="site-nav" aria-label="{{ $.Site.Params.navigationLabel }}">
        {{ range . }}
          <a href="{{ .URL }}">
            {{ .Name }}
          </a>
        {{ end }}
      </nav>
    {{ end }}

  </div>
</header>
