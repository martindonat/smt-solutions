<section class="hero" id="{{ .Params.hero.id }}">

  <div class="container hero__inner">

    <div class="hero__eyebrow">
      {{ .Params.hero.eyebrow }}
    </div>

    <h1 class="hero__title">
      {{ .Params.hero.title | strings.TrimSpace | replaceRE "\n" "<br>" | safeHTML }}
    </h1>

    <div class="hero__bottom">

      <p class="hero__intro">
        {{ .Params.hero.intro }}
      </p>

      {{ with .Params.hero.button }}
        <a class="button button--primary" href="{{ .url }}">
          {{ .text }}

          {{ with .icon }}
            <span aria-hidden="true">{{ . }}</span>
          {{ end }}
        </a>
      {{ end }}

    </div>

  </div>

</section>
