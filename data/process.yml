- title: "Verstehen"
  text: >-
    Was soll die Website erreichen? Wen soll sie ansprechen, wer wird sie pflegen
    und was ist dafür notwendig?


- title: "Strukturieren"
  text: >-
    Inhalte, Seitenaufbau und Nutzerführung werden auf das
    Wesentliche reduziert.


- title: "Gestalten"
  text: >-
    Daraus entsteht ein eigenständiges Design, das Inhalt
    und Funktion unterstützt.


- title: "Umsetzen"
  text: >-
    Das Design wird performant, responsiv und wartbar
    technisch umgesetzt.